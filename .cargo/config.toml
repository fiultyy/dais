[env]
# protoc 修复(2026-08-17):warp_multi_agent_api 的 prost-build 需要 protoc;
# 本机装在 ~/.local/bin(不在所有调用环境的 PATH 里),钉死绝对路径。
PROTOC = "/home/yy/.local/bin/protoc"
# bindgen 系统 C 头修复(2026-08-17):本机 libclang-15(runtime so)生成 bindings
# 时找不到自己的 builtin stddef.h —— 本机只装了 llvm-20 的完整 builtin 头。
# 显式指过去(builtin 头跨 clang 小版本兼容)。CI/其他机器有自己完整
# clang 时不依赖此参数。
BINDGEN_EXTRA_CLANG_ARGS = "-I/usr/lib/llvm-20/lib/clang/20/include"
# This is used to set the minimum deployment target for mac
# https://cmake.org/cmake/help/latest/envvar/MACOSX_DEPLOYMENT_TARGET.html
# If unset, it uses the system one, but we want to build for older versions
# of mac os by default.
#
# This should be kept in sync with the definition of this variable in
# `script/bundle`.
MACOSX_DEPLOYMENT_TARGET = "10.14"

[build]
rustflags = ["-C", "symbol-mangling-version=v0", "-C", "link-args=-Wl,-headerpad_max_install_names"]

[net]
git-fetch-with-cli = true

[target.'cfg(target_family = "wasm")']
rustflags = ["--cfg=web_sys_unstable_apis"]

# 静态 musl 构建(CLI / remote-server tarball)。
# `[build].rustflags` 里的 `-Wl,-headerpad_max_install_names` 是 macOS
# 专用 linker flag,会让 musl-gcc 报错;target-specific rustflags 会整体
# 覆盖 `[build].rustflags`,所以这里只保留通用的 symbol-mangling 设置,
# 并显式开启 crt-static 产出完全静态、不依赖宿主 libc 的二进制。
# linker 默认走 `cc`(在 CI 上由 musl-tools 提供 `musl-gcc`);
# 需要时可用 CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER 覆盖
# (见 script/deploy_remote_server)。
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "symbol-mangling-version=v0", "-C", "target-feature=+crt-static"]

# Linux 桌面构建提速(2026-08-28):
# - mold 2.34.1 用户级安装(~/projects/omx-scratch/mold, 无需 sudo)。
#   本机 gcc 13 不认 -fuse-ld=<绝对路径>(仅 bfd/gold/lld 名字), rustc 1.92 的
#   -fuse-ld=<name> 又优先走自带 gcc-ld lld shim → 唯一可靠姿势: gcc -B 目录
#   注入, 目录里 `ld` 是指向 mold 的 symlink, collect2 查找 ld 时命中 mold。
#   已验证 gcc -B + -Wl,-v 输出 mold 2.34.1 横幅。回退: 删本段恢复 [build] 默认 gold。
[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C", "symbol-mangling-version=v0",
    "-C", "link-args=-Wl,-headerpad_max_install_names",
    "-C", "link-args=-B/home/yy/projects/omx-scratch/mold/ldshim",
]

# 主盘空间紧张 (2026-08-29): dev profile 关增量编译,防 incremental 目录
# 失控膨胀 (曾 36G)。代价: 增量重编退化为全量重编。
[profile.dev]
incremental = false
