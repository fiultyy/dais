[package]
name = "code_model"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish.workspace = true

[features]
# 宿主(app)feature 转发(P-ARC R6):app 的 local_fs/local_tty feature 列表
# 需追加 "code_model/local_fs" / "code_model/local_tty"(注册尾巴一并处理)。
# local_fs 门控文件同步路径(global_buffer_model / snapshot::load_directory_children),
# local_tty 门控本地终端 buffer 路径(global_buffer_model)。
local_fs = ["dep:warp_files"]
local_tty = []

[dependencies]
remote_server.workspace = true
anyhow.workspace = true
# 与 app/Cargo.toml 同款声明(非 workspace 依赖表成员),对齐 R4 zeroize 先例。
bimap = "0.6.2"
cfg-if.workspace = true
futures-util.workspace = true
instant.workspace = true
log.workspace = true
pathfinder_geometry.workspace = true
serde.workspace = true
string-offset.workspace = true
sum_tree.workspace = true
thiserror.workspace = true
warp_core.workspace = true
warp_editor.workspace = true
warp_files = { workspace = true, optional = true }
warp_util.workspace = true
warpui.workspace = true
