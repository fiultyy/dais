[package]
name = "harness_blocks"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
# 0.35 pinned (not 0.31 as specced) because the workspace already links
# libsqlite3-sys 0.33, and cargo allows only one crate with links = "sqlite3".
# 0.35 is the rusqlite release built against libsqlite3-sys ^0.33.
rusqlite = { version = "0.35", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
