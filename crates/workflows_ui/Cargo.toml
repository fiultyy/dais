[package]
name = "workflows_ui"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish.workspace = true

[features]
# R1 三契约之一:宿主(app)以 dev-dependency + test-support 启用 mock 数据桥
# (InMemoryWorkflowData);crate 自身测试走 #[cfg(test)],不依赖本 feature。
test-support = []

[dependencies]
anyhow.workspace = true
itertools.workspace = true
lazy_static.workspace = true
log.workspace = true
objects.workspace = true
regex.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
settings_value = { workspace = true, features = ["derive"] }
string-offset.workspace = true
strum.workspace = true
strum_macros.workspace = true
warp-workflows.workspace = true
